<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="initial-scale=1,user-scalable=no,maximum-scale=1,width=device-width">
        <meta name="mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <link rel="stylesheet" href="./resources/ol.css">
        <link rel="stylesheet" href="resources/fontawesome-all.min.css">
        <link href="resources/photon-geocoder-autocomplete.min.css" rel="stylesheet">
        <link rel="stylesheet" href="./resources/ol-layerswitcher.css">
        <link rel="stylesheet" href="./resources/qgis2web.css">
        <style>
        html, body { background-color: #ffffff; }
        .ol-control > * {
            background-color: #f8f8f8!important;
            color: #444444!important;
            border-radius: 0px;
        }
        .ol-attribution a, .gcd-gl-input::placeholder, .search-layer-input-search::placeholder {
            color: #444444!important;
        }
        .search-layer-input-search { background-color: #f8f8f8!important; }
        .ol-control > *:focus, .ol-control > *:hover {
            background-color: rgba(248,248,248,0.7)!important;
        }
        .ol-control {
            background-color: rgba(255,255,255,.4)!important;
            padding: 2px!important;
        }
        html, body, #map { width:100%; height:100%; padding:0; margin:0; }

        /* Hide default qgis2web popup and layer switcher */
        #popup { display: none !important; }
        .layer-switcher { display: none !important; }

        /* Title banner */
        #map-title {
            position: fixed;
            top: 14px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(20, 60, 120, 0.82);
            color: white;
            padding: 10px 26px;
            border-radius: 8px;
            font-family: Arial, sans-serif;
            font-size: 17px;
            font-weight: bold;
            z-index: 1000;
            box-shadow: 0 3px 12px rgba(0,0,0,0.35);
            white-space: nowrap;
            letter-spacing: 0.4px;
        }

        /* Legend panel */
        #legend {
            position: fixed;
            bottom: 28px;
            right: 14px;
            background: rgba(255,255,255,0.93);
            border-radius: 8px;
            padding: 14px 16px;
            z-index: 1000;
            box-shadow: 0 3px 12px rgba(0,0,0,0.25);
            font-family: Arial, sans-serif;
            font-size: 13px;
            min-width: 210px;
        }
        #legend h3 {
            margin: 0 0 10px 0;
            font-size: 14px;
            font-weight: bold;
            color: #222;
            border-bottom: 1px solid #ddd;
            padding-bottom: 7px;
        }
        .legend-section-title {
            font-weight: bold;
            color: #444;
            margin: 10px 0 5px 0;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }
        .legend-item {
            display: flex;
            align-items: center;
            margin: 4px 0;
            color: #333;
        }
        .legend-item img {
            margin-right: 8px;
            width: 22px;
            height: 14px;
        }
        .layer-toggle {
            display: flex;
            align-items: center;
            margin: 6px 0;
            cursor: pointer;
            color: #333;
        }
        .layer-toggle input[type="checkbox"] {
            margin-right: 8px;
            cursor: pointer;
            width: 14px;
            height: 14px;
        }
        .layer-toggle img {
            margin-right: 7px;
            width: 22px;
            height: 14px;
        }

        /* Custom popup */
        #custom-popup {
            display: none;
            position: absolute;
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.35);
            min-width: 230px;
            max-width: 290px;
            z-index: 2000;
            font-family: Arial, sans-serif;
            font-size: 13px;
            overflow: hidden;
            pointer-events: auto;
        }
        #custom-popup-header {
            background: rgba(20, 60, 120, 0.88);
            color: white;
            padding: 10px 14px;
            font-weight: bold;
            font-size: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        #custom-popup-close {
            cursor: pointer;
            font-size: 20px;
            line-height: 1;
            opacity: 0.75;
            margin-left: 10px;
        }
        #custom-popup-close:hover { opacity: 1; }
        #custom-popup-body { padding: 10px 14px 12px 14px; }
        #custom-popup-body table { width: 100%; border-collapse: collapse; }
        #custom-popup-body tr { border-bottom: 1px solid #f0f0f0; }
        #custom-popup-body tr:last-child { border-bottom: none; }
        #custom-popup-body th {
            text-align: left;
            color: #666;
            font-weight: normal;
            padding: 5px 0;
            width: 55%;
        }
        #custom-popup-body td {
            text-align: right;
            font-weight: bold;
            color: #222;
            padding: 5px 0;
        }
        </style>
        <title>Melbourne Gym Accessibility Index</title>
    </head>
    <body>

        <!-- Title Banner -->
        <div id="map-title">🏋️ Melbourne Gym Accessibility Index</div>

        <!-- Legend -->
        <div id="legend">
            <h3>Map Legend</h3>

            <div class="legend-section-title">Gym Accessibility Index</div>
            <div class="legend-item">
                <img src="styles/legend/gyms_ptv_sa2_join_v6_withnorms_1_0.png"> Very Low (0 – 0.06)
            </div>
            <div class="legend-item">
                <img src="styles/legend/gyms_ptv_sa2_join_v6_withnorms_1_1.png"> Low (0.06 – 0.14)
            </div>
            <div class="legend-item">
                <img src="styles/legend/gyms_ptv_sa2_join_v6_withnorms_1_2.png"> Moderate (0.14 – 0.19)
            </div>
            <div class="legend-item">
                <img src="styles/legend/gyms_ptv_sa2_join_v6_withnorms_1_3.png"> High (0.19 – 0.32)
            </div>
            <div class="legend-item">
                <img src="styles/legend/gyms_ptv_sa2_join_v6_withnorms_1_4.png"> Very High (0.32 – 0.71)
            </div>
            <div class="legend-item">
                <img src="styles/legend/gyms_ptv_sa2_join_v6_withnorms_1_5.png"> No Data
            </div>

            <div class="legend-section-title">Toggle Layers</div>
            <label class="layer-toggle">
                <input type="checkbox" id="toggle-gyms" checked>
                <img src="styles/legend/gym_points_v2_clipped_4.png"> Gym Locations
            </label>
            <label class="layer-toggle">
                <input type="checkbox" id="toggle-ptv" checked>
                <img src="styles/legend/ptv_stops_clipped_3.png"> Public Transport Stops
            </label>
        </div>

        <!-- Map -->
        <div id="map">
            <div id="popup" class="ol-popup">
                <a href="#" id="popup-closer" class="ol-popup-closer"></a>
                <div id="popup-content"></div>
            </div>

            <!-- Custom Popup -->
            <div id="custom-popup">
                <div id="custom-popup-header">
                    <span id="custom-popup-title">—</span>
                    <span id="custom-popup-close">×</span>
                </div>
                <div id="custom-popup-body">
                    <table id="custom-popup-table"></table>
                </div>
            </div>
        </div>

        <script src="resources/qgis2web_expressions.js"></script>
        <script src="resources/proj4.js"></script>
        <script>proj4.defs('EPSG:7899','+proj=lcc +lat_0=-37 +lon_0=145 +lat_1=-36 +lat_2=-38 +x_0=2500000 +y_0=2500000 +ellps=GRS80 +units=m +no_defs');</script>
        <script src="./resources/functions.js"></script>
        <script src="./resources/ol.js"></script>
        <script src="./resources/ol-layerswitcher.js"></script>
        <script src="resources/photon-geocoder-autocomplete.min.js"></script>
        <script src="resources/olms.js"></script>
        <script src="layers/gyms_ptv_sa2_join_v6_withnorms_1.js"></script>
        <script src="layers/SA2_GM2021_2.js"></script>
        <script src="layers/ptv_stops_clipped_3.js"></script>
        <script src="layers/gym_points_v2_clipped_4.js"></script>
        <script src="styles/gyms_ptv_sa2_join_v6_withnorms_1_style.js"></script>
        <script src="styles/SA2_GM2021_2_style.js"></script>
        <script src="styles/ptv_stops_clipped_3_style.js"></script>
        <script src="styles/gym_points_v2_clipped_4_style.js"></script>
        <script src="./layers/layers.js" type="text/javascript"></script>
        <script src="./resources/Autolinker.min.js"></script>
        <script src="./resources/qgis2web.js"></script>

        <script>
        window.addEventListener('load', function () {
            setTimeout(function () {

                // --- Layer toggles ---
                document.getElementById('toggle-gyms').addEventListener('change', function () {
                    lyr_gym_points_v2_clipped_4.setVisible(this.checked);
                });
                document.getElementById('toggle-ptv').addEventListener('change', function () {
                    lyr_ptv_stops_clipped_3.setVisible(this.checked);
                });

                // --- Close popup ---
                document.getElementById('custom-popup-close').addEventListener('click', function () {
                    document.getElementById('custom-popup').style.display = 'none';
                });

                // --- Custom click handler ---
                if (typeof map !== 'undefined') {
                    map.on('singleclick', function (evt) {
                        var found = false;

                        map.forEachFeatureAtPixel(evt.pixel, function (feature, layer) {
                            if (found) return;

                            // Handle clustered and non-clustered features
                            var clusterFeatures = feature.get('features');
                            var f = clusterFeatures ? clusterFeatures[0] : feature;
                            var count = clusterFeatures ? clusterFeatures.length : 1;

                            // --- Gym Points ---
                            if (layer === lyr_gym_points_v2_clipped_4) {
                                if (count > 1) {
                                    showPopup('🏋️ Gym Cluster', [['Gyms in area', count]], evt.pixel);
                                } else {
                                    var gymName = f.get('name') || 'Unnamed Gym';
                                    showPopup('🏋️ ' + gymName, [], evt.pixel);
                                }
                                found = true;

                            // --- PTV Stops ---
                            } else if (layer === lyr_ptv_stops_clipped_3) {
                                if (count > 1) {
                                    showPopup('🚌 Transport Cluster', [['Stops in area', count]], evt.pixel);
                                } else {
                                    var stopName = f.get('STOP_NAME') || 'Unknown Stop';
                                    var mode = f.get('MODE') || 'Unknown';
                                    showPopup('🚌 ' + stopName, [['Transport Type', mode]], evt.pixel);
                                }
                                found = true;

                            // --- Suburb Choropleth ---
                            } else if (layer === lyr_gyms_ptv_sa2_join_v6_withnorms_1) {
                                var name    = f.get('SA2_NAME21') || 'Unknown Suburb';
                                var area    = f.get('AREASQKM21');
                                var pop     = f.get('seifa_Population');
                                var seifa   = f.get('seifa_IRSD_Score');
                                var ptv     = f.get('ptv_stop_count');
                                var gyms    = f.get('gym_count');
                                var gai     = f.get('weighted_GAI');

                                var rows = [
                                    ['Area (km²)',    area  ? parseFloat(area).toFixed(2)  : 'N/A'],
                                    ['Population',    pop   ? parseInt(pop).toLocaleString() : 'N/A'],
                                    ['SEIFA Score',   seifa ? seifa : 'N/A'],
                                    ['PTV Stops',     ptv   ? ptv   : '0'],
                                    ['Gym Count',     gyms  ? gyms  : '0'],
                                    ['GAI Score',     gai   ? parseFloat(gai).toFixed(3)  : 'N/A']
                                ];
                                showPopup('📍 ' + name, rows, evt.pixel);
                                found = true;
                            }
                        });

                        if (!found) {
                            document.getElementById('custom-popup').style.display = 'none';
                        }
                    });
                }

            }, 600);
        });

        function showPopup(title, rows, pixel) {
            var popup  = document.getElementById('custom-popup');
            var mapEl  = document.getElementById('map');

            document.getElementById('custom-popup-title').textContent = title;

            var html = '';
            rows.forEach(function (row) {
                html += '<tr><th>' + row[0] + '</th><td>' + row[1] + '</td></tr>';
            });
            document.getElementById('custom-popup-table').innerHTML = html;

            // Show first so we can measure dimensions
            popup.style.display = 'block';

            var x = pixel[0] + 12;
            var y = pixel[1] - 12;

            // Prevent overflow right
            if (x + popup.offsetWidth > mapEl.offsetWidth - 10) {
                x = pixel[0] - popup.offsetWidth - 12;
            }
            // Prevent overflow bottom
            if (y + popup.offsetHeight > mapEl.offsetHeight - 10) {
                y = pixel[1] - popup.offsetHeight - 12;
            }

            popup.style.left = x + 'px';
            popup.style.top  = y + 'px';
        }
        </script>
    </body>
</html>
